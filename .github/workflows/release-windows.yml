name: Release Windows Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Para poder lanzar manualmente

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Version from Tag or AppConstants
        id: get_version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $version = ""
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $constantsContent = Get-Content -Path "lib/src/core/constants/app_constants.dart" -Raw
            if ($constantsContent -match "appVersion\s*=\s*'v?([0-9]+\.[0-9]+\.[0-9]+)'") {
              $version = $Matches[1]
            }
          }
          if ([string]::IsNullOrEmpty($version)) { $version = "1.0.4" }
          Write-Host "Resolved APP_VERSION: $version"
          Write-Output "APP_VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./rust -> target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/installer.iss
          options: /DMyAppVersion=${{ steps.get_version.outputs.APP_VERSION }}

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\DataCare-Windows-Portable-v${{ steps.get_version.outputs.APP_VERSION }}.zip"
          Copy-Item "build\DataCare-Windows-Portable-v${{ steps.get_version.outputs.APP_VERSION }}.zip" -Destination "build\datacare-windows.zip"

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @()
          $installerFiles = Get-ChildItem -Path "build\installer\*.exe" -ErrorAction SilentlyContinue
          $zipFiles = Get-ChildItem -Path "build\DataCare-Windows-Portable-*.zip" -ErrorAction SilentlyContinue
          if ($installerFiles) { $files += $installerFiles }
          if ($zipFiles) { $files += $zipFiles }
          $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Out-File -FilePath "build\checksums-sha256.txt" -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/installer/*.exe
            build/windows/x64/runner/Release/datacare.exe
            build/DataCare-Windows-Portable-*.zip
            build/datacare-windows.zip
            build/checksums-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.get_version.outputs.APP_VERSION }}
          name: DataCare v${{ steps.get_version.outputs.APP_VERSION }}
          files: |
            build/installer/*.exe
            build/windows/x64/runner/Release/datacare.exe
            build/DataCare-Windows-Portable-*.zip
            build/datacare-windows.zip
            build/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false

