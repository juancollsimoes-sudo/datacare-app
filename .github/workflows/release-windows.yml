name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Para poder lanzar manualmente

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Version from Tag
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrEmpty($version)) { $version = "0.1.0" }
          Write-Output "APP_VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./rust -> target"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/installer.iss
          options: /DMyAppVersion=${{ steps.get_version.outputs.APP_VERSION }}

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\DataCare-Windows-Portable-v${{ steps.get_version.outputs.APP_VERSION }}.zip"

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @()
          $installerFiles = Get-ChildItem -Path "build\installer\*.exe" -ErrorAction SilentlyContinue
          $zipFiles = Get-ChildItem -Path "build\DataCare-Windows-Portable-*.zip" -ErrorAction SilentlyContinue
          if ($installerFiles) { $files += $installerFiles }
          if ($zipFiles) { $files += $zipFiles }
          $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Out-File -FilePath "build\checksums-sha256.txt" -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/installer/*.exe
            build/DataCare-Windows-Portable-*.zip
            build/checksums-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/installer/*.exe
            build/DataCare-Windows-Portable-*.zip
            build/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
